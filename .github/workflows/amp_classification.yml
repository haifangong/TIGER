name: Verify AMP classification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay-and-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r amp_classification/requirements-replay.txt catboost==1.2.10 joblib==1.4.2 threadpoolctl==3.5.0
      - run: python -m amp_classification verify
      - run: python -m amp_classification replay
      - run: python -m amp_classification predict --model CatBoost-Tuned --input amp_classification/data/Test.csv --output outputs/amp_CatBoost-Tuned.csv --check-reference
      - run: python -m amp_classification predict --model ExtraTrees --input amp_classification/data/Test.csv --output outputs/amp_ExtraTrees.csv --check-reference
      - run: python -m unittest discover -s amp_classification/tests -v
