name: Verify TIGER-pair V17
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_v17.py
      - run: python scripts/plot_v17.py
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-model.txt
      - run: python -m code.main predict --seed 123 --device cpu --check-reference
